server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Compresión ---
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml application/xml+rss
        image/svg+xml application/font-woff2;

    # --- Assets con hash de Astro: inmutables, cache de 1 año ---
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # --- Imágenes, video, PDF, descargas: cache de 30 días ---
    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|mp4|webm|pdf|zip|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # --- HTML: siempre revalidar para que un redeploy se vea al instante ---
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Página 404 propia de Astro si existe
    error_page 404 /404.html;
}
